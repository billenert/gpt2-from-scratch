[project]
name = "gpt2-from-scratch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "jaxtyping",
    "einops",
    "tiktoken",
    "datasets",
    "tqdm",
    "wandb",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model*", "data*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]                                                                                                                                                                                                                          
markers = ["slow: tests that take more than ~1s"]
addopts = "-m 'not slow'"                                                                                                                                                                                       
